# Beispiel: .github/workflows/claude-review.yml
# Voraussetzung: Secret ANTHROPIC_API_KEY im Repository (oder Einrichtung per /install-github-app)
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  claude:
    if: github.event_name == 'pull_request' || contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Reviewe diesen Pull Request gegen die Regeln in CLAUDE.md.
            Kommentiere nur echte Probleme, keine Stilfragen.
